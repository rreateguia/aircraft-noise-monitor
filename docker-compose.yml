services:
  backend:
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile

    ports:
      - "8000:8000"

    environment:
      DATABASE_DIR: /app/data

    volumes:
      - aircraft_noise_data:/app/data

  frontend:
    
    build:
      context: .
      dockerfile: frontend/Dockerfile

    ports:
      - "8080:80"

    depends_on:
      backend:
        condition: service_healthy

volumes:
  aircraft_noise_data: